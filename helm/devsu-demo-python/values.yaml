replicaCount: 2

image:
  repository: ghcr.io/jorgemrqz/devsu-demo-devops-python
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: demo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS config:
  # - secretName: devsu-demo-tls
  #   hosts:
  #     - demo.local

env:
  databaseName: "db.sqlite3"

secret:
  djangoSecretKey: "django-insecure-wc2i2*6^17$9!u+(u66@q_rg)++n1x-^(0-$3yz2f(n=_-o*7="

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  readiness:
    path: /api/users/
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:
    path: /api/users/
    initialDelaySeconds: 15
    periodSeconds: 20
